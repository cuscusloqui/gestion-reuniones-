<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reuniones</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="logo">📅 Reuniones</span>
  </div>

  <div class="topbar-center">
    <div class="view-switch" role="tablist" aria-label="Selector de vista">
      <button class="view-tab" data-view="month" aria-selected="true">Mes</button>
      <button class="view-tab" data-view="week" aria-selected="false">Semana</button>
      <button class="view-tab" data-view="day" aria-selected="false">Día</button>
    </div>
    <div class="nav-controls">
      <button class="icon-btn" id="btn-prev" title="Anterior" aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn-hoy" id="btn-today">Hoy</button>
      <button class="icon-btn" id="btn-next" title="Siguiente" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <span class="range-label" id="range-label"></span>
  </div>

  <div class="topbar-right">
    <button class="btn btn-ghost" id="btn-search">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Buscar
    </button>
    <button class="btn btn-primary" id="btn-new">
      <svg viewBox="0 0 24 24" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Nueva reunión
    </button>
  </div>
</header>

<main id="calendar-root">
  <section class="month-view" id="month-view"></section>
  <section class="week-view" id="week-view" hidden></section>
  <section class="day-view" id="day-view" hidden></section>
</main>

<!-- Popover "+N más" -->
<div class="popover" id="popover-mas" hidden></div>

<!-- Modal editor de reunion -->
<div class="modal-overlay" id="modal-editor" hidden>
  <div class="modal modal-wide">
    <div class="modal-header">
      <h2 id="editor-titulo-modal">Nueva reunión</h2>
      <button class="icon-btn" id="btn-cerrar-editor" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="campo">
        <label for="input-titulo">Título</label>
        <input type="text" id="input-titulo" maxlength="300" placeholder="Título de la reunión">
      </div>

      <div class="campo-fila">
        <div class="campo">
          <label for="input-inicio">Fecha y hora de inicio</label>
          <input type="datetime-local" id="input-inicio">
        </div>
        <div class="campo">
          <label for="input-fin">Fecha y hora de fin (opcional)</label>
          <input type="datetime-local" id="input-fin">
        </div>
      </div>

      <div class="campo">
        <label for="input-interviniente-nuevo">Intervinientes</label>
        <div class="tags-input" id="intervinientes-tags">
          <input type="text" id="input-interviniente-nuevo" placeholder="Escribe un nombre y pulsa Enter o coma">
        </div>
      </div>

      <div class="campo">
        <label>Contenido</label>
        <div class="editor-toolbar" id="editor-toolbar">
          <select class="tb-select" id="tb-heading" title="Encabezado">
            <option value="P">Párrafo</option>
            <option value="H1">Título 1</option>
            <option value="H2">Título 2</option>
            <option value="H3">Título 3</option>
          </select>

          <span class="tb-sep"></span>

          <button type="button" class="tb-btn" data-cmd="bold" title="Negrita (Ctrl+B)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 4h6a3.5 3.5 0 010 7H6zM6 11h7a3.5 3.5 0 010 7H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="italic" title="Cursiva (Ctrl+I)"><svg viewBox="0 0 24 24" width="16" height="16"><line x1="10" y1="4" x2="18" y2="4" stroke="currentColor" stroke-width="2"/><line x1="6" y1="20" x2="14" y2="20" stroke="currentColor" stroke-width="2"/><line x1="14" y1="4" x2="10" y2="20" stroke="currentColor" stroke-width="2"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="underline" title="Subrayado (Ctrl+U)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 4v7a6 6 0 0012 0V4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="5" y1="20" x2="19" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="strikeThrough" title="Tachado"><svg viewBox="0 0 24 24" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 6c0-1.5 1.5-3 4-3s4 1 4 2.5M8 18c0 1.5 1.7 3 4 3s4-1.5 4-3" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>

          <span class="tb-sep"></span>

          <button type="button" class="tb-btn" data-cmd="insertUnorderedList" title="Lista con viñetas"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="5" cy="6" r="1.4" fill="currentColor"/><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="5" cy="18" r="1.4" fill="currentColor"/><line x1="9" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="insertOrderedList" title="Lista numerada"><svg viewBox="0 0 24 24" width="16" height="16"><text x="1" y="9" font-size="7" fill="currentColor">1</text><text x="1" y="15" font-size="7" fill="currentColor">2</text><text x="1" y="21" font-size="7" fill="currentColor">3</text><line x1="9" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="formatBlock" data-value="BLOCKQUOTE" title="Cita"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 8c-2 1-3 2.5-3 5s1.5 3.5 3 3.5 2.5-1 2.5-2.5S8.5 12 7 12M17 8c-2 1-3 2.5-3 5s1.5 3.5 3 3.5 2.5-1 2.5-2.5S18.5 12 17 12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="formatBlock" data-value="PRE" title="Bloque de código"><svg viewBox="0 0 24 24" width="16" height="16"><polyline points="8,6 3,12 8,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="16,6 21,12 16,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <span class="tb-sep"></span>

          <label class="tb-color" title="Color de fuente">
            <svg viewBox="0 0 24 24" width="16" height="16"><text x="4" y="17" font-size="14" fill="currentColor">A</text></svg>
            <input type="color" id="tb-forecolor" value="#0f172a">
          </label>
          <label class="tb-color" title="Color de resaltado">
            <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="14" width="18" height="6" fill="currentColor"/></svg>
            <input type="color" id="tb-backcolor" value="#fef08a">
          </label>

          <span class="tb-sep"></span>

          <button type="button" class="tb-btn" data-cmd="justifyLeft" title="Alinear izquierda"><svg viewBox="0 0 24 24" width="16" height="16"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4" y1="18" x2="18" y2="18" stroke="currentColor" stroke-width="2"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="justifyCenter" title="Centrar"><svg viewBox="0 0 24 24" width="16" height="16"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2"/><line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2"/><line x1="5" y1="18" x2="19" y2="18" stroke="currentColor" stroke-width="2"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="justifyRight" title="Alinear derecha"><svg viewBox="0 0 24 24" width="16" height="16"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2"/><line x1="10" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"/><line x1="6" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2"/></svg></button>

          <span class="tb-sep"></span>

          <button type="button" class="tb-btn" id="tb-link" title="Insertar enlace"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 15l6-6M8 16l-2 2a3.5 3.5 0 01-5-5l3-3a3.5 3.5 0 015 0M16 8l2-2a3.5 3.5 0 015 5l-3 3a3.5 3.5 0 01-5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <button type="button" class="tb-btn" id="tb-image" title="Insertar imagen"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor"/><path d="M21 16l-5-5-4 4-3-3-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <input type="file" id="tb-image-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

          <span class="tb-sep"></span>

          <button type="button" class="tb-btn" data-cmd="undo" title="Deshacer"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="redo" title="Rehacer"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" class="tb-btn" data-cmd="removeFormat" title="Limpiar formato"><svg viewBox="0 0 24 24" width="16" height="16"><text x="2" y="17" font-size="13" fill="currentColor">T</text><line x1="4" y1="20" x2="20" y2="20" stroke="currentColor" stroke-width="2"/><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>

        <div class="link-popover" id="link-popover" hidden>
          <input type="text" id="link-url" placeholder="https://ejemplo.com">
          <button type="button" class="btn btn-primary btn-sm" id="link-aceptar">Insertar</button>
          <button type="button" class="btn btn-ghost btn-sm" id="link-cancelar">Cancelar</button>
        </div>

        <div class="rich-editor" id="rich-editor" contenteditable="true"></div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-eliminar" hidden>Eliminar</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="btn-cerrar-footer">Cerrar</button>
      <button class="btn btn-primary" id="btn-guardar">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal detalle de reunion -->
<div class="modal-overlay" id="modal-detalle" hidden>
  <div class="modal modal-wide">
    <div class="modal-header">
      <h2 id="detalle-titulo">Reunión</h2>
      <button class="icon-btn" id="btn-cerrar-detalle" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="detalle-meta">
        <div><strong>Cuándo:</strong> <span id="detalle-fechas"></span></div>
        <div id="detalle-intervinientes-wrap"><strong>Intervinientes:</strong> <span id="detalle-intervinientes"></span></div>
      </div>
      <div class="detalle-contenido" id="detalle-contenido"></div>
    </div>
    <div class="modal-footer">
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="btn-cerrar-detalle-footer">Cerrar</button>
      <button class="btn btn-primary" id="btn-editar-desde-detalle">Editar</button>
    </div>
  </div>
</div>

<!-- Modal busqueda avanzada -->
<div class="modal-overlay" id="modal-busqueda" hidden>
  <div class="modal modal-wide">
    <div class="modal-header">
      <h2>Buscar reuniones</h2>
      <button class="icon-btn" id="btn-cerrar-busqueda" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="busqueda-form">
        <div class="campo-fila">
          <div class="campo">
            <label for="buscar-desde">Desde</label>
            <input type="datetime-local" id="buscar-desde">
          </div>
          <div class="campo">
            <label for="buscar-hasta">Hasta</label>
            <input type="datetime-local" id="buscar-hasta">
          </div>
        </div>
        <div class="campo">
          <label for="buscar-titulo">Título contiene</label>
          <input type="text" id="buscar-titulo">
        </div>
        <div class="campo">
          <label for="buscar-contenido">Contenido contiene</label>
          <input type="text" id="buscar-contenido">
        </div>
        <div class="campo">
          <label for="buscar-interviniente">Interviniente contiene</label>
          <input type="text" id="buscar-interviniente">
        </div>
        <div class="campo">
          <label for="buscar-q">Búsqueda global</label>
          <input type="text" id="buscar-q" placeholder="Busca en título, contenido e intervinientes">
        </div>
        <div class="busqueda-acciones">
          <button class="btn btn-ghost" id="btn-limpiar-busqueda">Limpiar</button>
          <button class="btn btn-primary" id="btn-ejecutar-busqueda">Buscar</button>
        </div>
      </div>

      <div class="resultados" id="resultados-busqueda"></div>
      <div class="paginacion" id="paginacion-busqueda" hidden>
        <button class="icon-btn" id="pag-anterior">‹</button>
        <span id="pag-info"></span>
        <button class="icon-btn" id="pag-siguiente">›</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
